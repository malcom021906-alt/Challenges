<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGradient)"/>
  
  <!-- Contact book icon -->
  <g transform="translate(100, 80)">
    <!-- Book cover -->
    <rect x="40" y="0" width="280" height="352" rx="20" fill="white" opacity="0.95"/>
    
    <!-- Tabs on the side -->
    <rect x="0" y="60" width="40" height="50" rx="8" fill="white" opacity="0.7"/>
    <rect x="0" y="130" width="40" height="50" rx="8" fill="white" opacity="0.7"/>
    <rect x="0" y="200" width="40" height="50" rx="8" fill="white" opacity="0.7"/>
    <rect x="0" y="270" width="40" height="50" rx="8" fill="white" opacity="0.7"/>
    
    <!-- Person icon -->
    <circle cx="180" cy="120" r="35" fill="#2563eb"/>
    <path d="M 180 165 Q 140 165 120 190 L 120 220 L 240 220 L 240 190 Q 220 165 180 165 Z" fill="#2563eb"/>
    
    <!-- Contact lines -->
    <rect x="90" y="250" width="180" height="12" rx="6" fill="#94a3b8"/>
    <rect x="90" y="280" width="140" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="90" y="310" width="160" height="12" rx="6" fill="#cbd5e1"/>
  </g>
</svg>
